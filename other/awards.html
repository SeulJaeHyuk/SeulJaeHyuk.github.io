<!-- 보호 안내 토스트 -->
<div class="guard-toast" id="guardToast" role="status" aria-live="polite"><span class="ico">🔒</span><span id="guardMsg"></span></div>

<script>
  /* ============================================================

     tags     : (선택) ["AI", "IT"] 배열 — 없으면 표시 안 함
     ============================================================ */

    { cat: "college", icon: "🎓", year: "2022", title: "공학전문학사", team: "설재혁",
      detail: "공학 전문학사 취득",
      prize: "공학전문학사" },

    { cat: "college", icon: "🏅", year: "2022", title: "2022 컴퓨터정보과 BOOTCAMP 경진대회", team: "Binary · 메이킹필름팀",
      detail: "Vision AI를 이용한 동아리실 출입 관리 프로그램 / 2022 컴퓨터정보과 BOOTCAMP 촬영 후 편집",
      prize: "특별상" },

    { cat: "college", icon: "🥉", year: "2022", title: "2022 디지텍 캡스톤 디자인 경진대회", team: "Binary",
      detail: "Vision AI를 이용한 동아리실 출입 관리 프로그램",
      prize: "동상", level: "bronze" },

    { cat: "college", icon: "🏆", year: "2022", title: "2022 DIT 캡스톤 디자인 경진대회", team: "Binary",
      detail: "인공지능을 이용한 동아리실 출입관리 시스템",
      prize: "대상", level: "gold" },

    { cat: "college", icon: "🥇", year: "2019", title: "2019 DIT 캡스톤 디자인 경진대회", team: "오버플로우 소프트웨어",

    { cat: "college", icon: "🥈", year: "2019", title: "2019 부산권 LINC+ 15개 대학 연합 캡스톤디자인 경진대회", team: "오버플로우 소프트웨어",
      detail: "Gamma Canary : 사물인터넷(IoT)을 이용한 방사능 오염 탐지 시스템",
      prize: "우수상", level: "silver" },

    { cat: "college", icon: "🎬", year: "2019", title: "2019 컴퓨터정보과 BOOTCAMP 경진대회", team: "메이킹필름팀",
      detail: "2019 컴퓨터정보과 BOOTCAMP 예선·본선 촬영 후 편집",
      prize: "특별상" },

    { cat: "social", icon: "🎖️", year: "육군", title: "훈육평가 우수", team: "설재혁",

    { cat: "social", icon: "👮", year: "경찰", title: "모범상", team: "설재혁",
      detail: "모범상 수상 (부산동부경찰서장)",

      detail: "초·중·고 3년 개근상 수상",
      prize: "3년 개근상" },

    { cat: "school", icon: "🤝", year: "고교", title: "선행상", team: "설재혁",

    { cat: "school", icon: "⭐", year: "중·고", title: "모범상 (2회)", team: "설재혁",
      detail: "모범상 수상",
      prize: "모범상" },

    { cat: "school", icon: "📋", year: "고교", title: "전교 학생회 임명장", team: "설재혁",

      prize: "우수상", level: "silver" },

    { cat: "school", icon: "✍️", year: "고교", title: "바른말고운말 글쓰기 대회", team: "설재혁",

    { cat: "school", icon: "📚", year: "고교", title: "독서노트 기록", team: "설재혁",

      prize: "동상", level: "bronze" },

    { cat: "school", icon: "📝", year: "고교", title: "자기소개서 작성 경시대회", team: "설재혁",
      detail: "자기소개서 작성 경시대회 우량상 수상",
      prize: "우량상" },

    { cat: "school", icon: "⌨️", year: "초등", title: "타자검정대회", team: "설재혁",
      detail: "타자검정대회 장려상 수상",
      prize: "장려상" },

    { cat: "school", icon: "🔍", year: "초등", title: "정보검색대회", team: "설재혁",
      detail: "정보검색대회 장려상 수상",
      prize: "장려상" },

    { cat: "school", icon: "🔬", year: "중학교", title: "강연후기 장려상", team: "설재혁",
      detail: "\"고교생 물리홍보대사가 찾아가는 중학교 강연\" 강연후기 장려상 (한국물리학회장상)",
      prize: "장려상" }
  ];

  const catLabel = { college: "COLLEGE · PATENT", social: "MILITARY · EXTERNAL", school: "SCHOOL DAYS" };

  // 요소가 있을 때만 값을 넣는 도우미 — HTML에서 통계 카드를 지워도 오류가 나지 않음
  const setText = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  };

  // 렌더링 — hashtags / tags 가 없는 항목도 오류 없이 표시
  const list = document.getElementById('awardList');
  list.innerHTML = awards.map(a => {
    const hashtagsHtml = a.hashtags ? `<div class="hashtags">${a.hashtags}</div>` : '';
    const tagsHtml = (a.tags && a.tags.length)
      ? `<div class="tags">${a.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`
      : '';
    return `
    <article class="award reveal" data-cat="${a.cat}">
      <div class="year"><span class="icon">${a.icon}</span><small>${a.year}</small></div>
      <div>
        <div class="award-cat">${catLabel[a.cat]}</div>
        <h3>${a.title}</h3>
        <div class="detail"><b>[${a.team}]</b> ${a.detail}</div>
        ${hashtagsHtml}
        ${tagsHtml}
      </div>
      <div class="prize ${a.level || ''}">${a.prize}</div>
    </article>`;
  }).join('');

  // 통계 / 카운트
  setText('statTotal', awards.length);
  const updateCount = () =>
    setText('countNum', document.querySelectorAll('.award:not(.hide)').length);
  updateCount();

  // 필터
  document.querySelectorAll('.filter').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      document.querySelectorAll('.award').forEach(el => {
        el.classList.toggle('hide', f !== 'all' && el.dataset.cat !== f);
        el.classList.add('show');
      });
      updateCount();
    });
  });

  // 헤더 스크롤 효과
  const header = document.getElementById('header');
  window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 10));

  // 다크 모드 (portfolio.html과 같은 저장 키 사용)
  const themeBtn = document.getElementById('themeBtn');
  const setTheme = t => {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('theme', t); } catch (e) {}
  };
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () =>
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  // 스크롤 등장 애니메이션
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); io.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
<script>
  /* ============================================================
     콘텐츠 보호 (index.html · overflow.html과 동일)
     - 우클릭 · 드래그 · 텍스트 선택 · 복사 방지
     - 개발자 도구 / 소스 보기 / 페이지 저장 단축키 차단
     - Tab · 방향키 · 스페이스 · 필터 버튼(Enter·Space) · 새로고침 등은 그대로 사용 가능
     ※ 일반 방문자의 무단 복사를 막는 "억제" 장치입니다. 브라우저 메뉴나
        자바스크립트 끄기 등으로는 우회할 수 있습니다.
     ============================================================ */
  (() => {
    const toast = document.getElementById('guardToast');
    const msg = document.getElementById('guardMsg');
    let hideTimer = null;
    const notify = text => {
      if (!toast) return;
      msg.textContent = text;
      toast.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    };
    const isEditable = el => el && el.closest && el.closest('input, textarea, [contenteditable="true"]');

    // 1) 우클릭 메뉴 (확대한 사진 위 포함)
    document.addEventListener('contextmenu', e => {
      if (isEditable(e.target)) return;
      e.preventDefault();
      notify('콘텐츠 보호를 위해 우클릭이 제한됩니다');
    });

    // 2) 드래그 (사진 · 링크 · 텍스트)
    document.addEventListener('dragstart', e => { if (!isEditable(e.target)) e.preventDefault(); });

    // 3) 텍스트 선택
    document.addEventListener('selectstart', e => { if (!isEditable(e.target)) e.preventDefault(); });

    // 4) 복사 · 잘라내기
    ['copy', 'cut'].forEach(type => document.addEventListener(type, e => {
      if (isEditable(e.target)) return;
      e.preventDefault();
      notify('콘텐츠 보호를 위해 복사가 제한됩니다');
    }));

    // 5) 개발자 도구 · 소스 보기 · 저장 · 전체 선택 단축키 (그 외 키는 막지 않음)
    document.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase();
      const mod = e.ctrlKey || e.metaKey;              // Windows: Ctrl / Mac: Cmd
      const devtools =
        k === 'f12' ||
        (mod && e.shiftKey && ['i', 'j', 'c', 'k'].includes(k)) ||
        (e.metaKey && e.altKey && ['i', 'j', 'c', 'u'].includes(k));
      const source = mod && k === 'u';
      const save   = mod && k === 's';
      const selAll = mod && k === 'a' && !isEditable(e.target);

      if (devtools || source || save || selAll) {
        e.preventDefault();
        e.stopPropagation();
        notify(devtools ? '개발자 도구는 사용할 수 없습니다'
             : source   ? '소스 보기는 제한됩니다'
             : save     ? '페이지 저장은 제한됩니다'
             :            '콘텐츠 보호를 위해 선택이 제한됩니다');
      }
    }, true);

    // 6) 콘솔을 연 사람에게 보이는 안내 메시지
    console.log('%c잠깐!', 'color:#1f3a68;font-size:28px;font-weight:800;');
    console.log('%c이 사이트의 콘텐츠는 저작권 보호를 받습니다. 협업 문의는 jaehyuk7767@naver.com 으로 연락 주세요.',
                'font-size:13px;color:#5b6170;');
  })();
</script>

</html>
